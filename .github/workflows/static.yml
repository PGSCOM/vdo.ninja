# Workflow for deploying static content to Cloudflare Pages
name: Deploy static content to Cloudflare Pages

on:
  push:
    branches: ['*']
  pull_request:
    types: [closed]
  workflow_dispatch:

# Sets necessary permissions
permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: cloudflare-pages
      # Use the URL from Cloudflare deployment
      url: ${{ steps.cloudflare-deployment.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Remove thirdparty/longpipe (demasiado grande para deploy)
        run: rm -rf thirdparty/longpipe
      
      - name: Deploy to Cloudflare Pages
        id: cloudflare-deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=vdo-ninja --commit-dirty=true
